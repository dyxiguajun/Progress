<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progress 后台采集</title><link rel="stylesheet" href="options.css"><main><h1>后台采集</h1><p>授权进度接口所在域名后，在 Progress 连接配置里开启后台采集。关闭网页后仍会定期更新；Chrome 需要保持运行。</p><form id="grant"><label for="endpoint">JSON 进度接口地址</label><input id="endpoint" type="url" placeholder="https://example.com/progress.json" required><button>授权接口域名</button></form><p id="status" role="status"></p><h2>已授权域名</h2><div id="permissions"></div><h2>采集来源</h2><div id="sources"></div><button id="clear" class="secondary">停止全部采集并清除缓存</button><p>最低采集间隔为 30 秒。浏览器关闭、休眠或网络断开时会暂停；恢复后重新采集。插件只读取进度 JSON，文件传输等任务由对应服务执行。</p></main><script type="module" src="options.js"></script></html>
